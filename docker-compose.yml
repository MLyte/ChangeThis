services:
  changethis:
    build:
      context: .
    image: changethis:self-hosted
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_MODE: ${AUTH_MODE:-supabase}
      DATA_STORE: ${DATA_STORE:-supabase}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ENABLE_PUBLIC_SIGNUP: ${ENABLE_PUBLIC_SIGNUP:-false}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_REST_TIMEOUT_MS: ${SUPABASE_REST_TIMEOUT_MS:-10000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://changethis:changethis@postgres:5432/changethis}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      CRAW_AUTH_SHARED_SECRET: ${CRAW_AUTH_SHARED_SECRET:-}
      CRAW_AUTH_JWKS_URL: ${CRAW_AUTH_JWKS_URL:-}
      CHANGETHIS_SECRET_KEY: ${CHANGETHIS_SECRET_KEY:-}
      CHANGETHIS_CRON_SECRET: ${CHANGETHIS_CRON_SECRET:-}
      GITHUB_PROVIDER_INTEGRATION_ID: ${GITHUB_PROVIDER_INTEGRATION_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CHANGETHIS_GITHUB_TOKEN: ${CHANGETHIS_GITHUB_TOKEN:-}
      GITLAB_PROVIDER_INTEGRATION_ID: ${GITLAB_PROVIDER_INTEGRATION_ID:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_OAUTH_APP_ID: ${GITLAB_OAUTH_APP_ID:-}
      GITLAB_OAUTH_APP_SECRET: ${GITLAB_OAUTH_APP_SECRET:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      CHANGETHIS_GITLAB_TOKEN: ${CHANGETHIS_GITLAB_TOKEN:-}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changethis}
      POSTGRES_USER: ${POSTGRES_USER:-changethis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:

services:
  backend:
    build:
      context: .
    image: changethis:craw-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8000}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-only-for-local-development}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://changethis:changethis@postgres:5432/changethis}
      FILES_ROOT: /var/lib/changethis/files
      TEMP_DIR: /var/lib/changethis/tmp
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    volumes:
      - changethis-files:/var/lib/changethis/files
      - changethis-tmp:/var/lib/changethis/tmp
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build --workspace @changethis/shared && npm run build --workspace @changethis/frontend && npm run preview --workspace @changethis/frontend -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
    environment:
      VITE_API_BASE_URL: ${PUBLIC_APP_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changethis}
      POSTGRES_USER: ${POSTGRES_USER:-changethis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  changethis-files:
  changethis-tmp:
